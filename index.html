<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout Muelles — Control de Despacho</title>

<!-- FAVICON: Cajita tipo paquete/paquetería para la pestaña de Chrome -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230f9d8f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z'></path><polyline points='3.27 6.96 12 12.01 20.73 6.96'></polyline><line x1='12' y1='22.08' x2='12' y2='12'></line><polyline points='7.5 4.21 16.5 9.41'></polyline></svg>">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ffffff;
    --panel: #ffffff;
    --panel-alt: #f6f7f9;
    --line: #e2e4ea;
    --line-soft: #edeef2;
    --text: #12141a;
    --muted: #6b7080;
    --muted-dim: #a6aab5;
    --cyan: #0f9d8f;

    --c0: #9ea3b0;    /* vacío */
    --c0-bg: #f0f1f4;
    --c1: #3b82f6;    /* 1 ruta - azul */
    --c1-bg: #3b82f61a;
    --c2: #a855f7;    /* 2 rutas - morado */
    --c2-bg: #a855f71a;
    --c3: #ef4444;    /* 3 rutas - rojo */
    --c3-bg: #ef44441a;
    --c4: #f97316;    /* 4 rutas - naranja */
    --c4-bg: #f973161a;
    --c5: #ec4899;    /* 5+ rutas - magenta */
    --c5-bg: #ec48991a;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Lexend', 'Inter', sans-serif;
    min-height: 100vh;
    padding: 16px;
  }

  .wrap{ max-width: 1280px; margin: 0 auto; }

  .board{ display:none; }
  .board.active{ display:block; }

  /* ---------- DROPZONE INICIAL ---------- */
  .dropzone{
    border: 1px dashed #c7cad2;
    border-radius: 12px;
    background: var(--panel-alt);
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .dropzone:hover, .dropzone.drag{
    border-color: var(--cyan);
    background: #0f9d8f08;
  }
  .dropzone input{ display:none; }
  .dz-icon{
    width: 40px; height: 40px; margin: 0 auto 12px;
    border: 1.5px solid var(--muted-dim);
    border-radius: 10px;
    display:flex; align-items:center; justify-content:center;
    color: var(--muted);
  }
  .dz-title{
    font-family:'Space Grotesk', sans-serif;
    font-size: 16px; font-weight: 600; margin-bottom: 4px;
  }
  .dz-sub{ color: var(--muted); font-size: 12.5px; }
  .dz-sub b{ color: var(--text); font-weight: 500; }
  .dz-error{
    margin-top: 12px; color: #d92d20; font-size: 12px; font-family:'JetBrains Mono',monospace;
    display:none;
  }

  /* ---------- RENGLÓN UNIFICADO DE HEADER Y TARJETAS ---------- */
  .top-row-grid{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
    align-items: center;
  }

  /* Base para todas las tarjetas tipo pill/badge */
  .top-card{
    background: #f1f3f7;
    border: 1px solid #dcdfe6;
    border-radius: 8px;
    padding: 6px 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 42px;
  }

  /* Título Brand */
  .card-brand{
    background: var(--panel);
    border-color: var(--line);
  }
  .brand{
    font-family:'Space Grotesk', sans-serif;
    font-size: 14px; font-weight: 700; white-space: nowrap;
  }
  .brand span{ color: var(--cyan); }

  /* Jornada Card */
  .card-jornada{
    border-color: #0f9d8f3a;
    background: #0f9d8f0d;
  }
  .jornada-val{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 600; color: var(--cyan);
    white-space: nowrap;
  }

  /* Tarjetas de Métricas */
  .stat-card{
    flex: 1;
    min-width: 110px;
    background: #f4f5f8;
    border-color: #e0e3eb;
    transition: all .15s ease;
  }
  .stat-label{
    font-size: 9px; letter-spacing: 0.8px; color: var(--muted);
    text-transform: uppercase; margin-bottom: 1px; white-space: nowrap;
  }
  .stat-value{
    font-family:'JetBrains Mono', monospace;
    font-size: 15px; font-weight: 700; line-height: 1;
    color: var(--text);
  }
  .stat-value small{ font-size: 10.5px; color: var(--muted); font-weight:400; }

  /* Acciones (Cargar Viajes e Imprimir) a la misma altura */
  .card-action-group{
    display: flex;
    align-items: center;
    gap: 6px;
    height: 42px;
  }

  .upload-btn-card{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid #dcdfe6;
    border-radius: 8px;
    padding: 0 14px;
    height: 42px;
    cursor: pointer;
    background: #f1f3f7;
    transition: all .15s ease;
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
  }
  .upload-btn-card:hover{ border-color: var(--cyan); color: var(--cyan); background: #0f9d8f0d; }
  .upload-btn-card input{ display:none; }

  .print-btn-card{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #f1f3f7;
    border: 1px solid #dcdfe6;
    color: var(--text);
    font-family: 'Lexend', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 0 14px;
    height: 42px;
    border-radius: 8px;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .print-btn-card:hover{ border-color: var(--cyan); color: var(--cyan); background: #0f9d8f0d; }

  /* ---------- LEYENDA (POR ENCIMA DE LAS COLUMNAS) ---------- */
  .legend-top{
    margin-bottom: 10px;
    display:flex; flex-wrap:wrap; gap: 12px;
    padding: 6px 12px; background: var(--panel-alt);
    border: 1px solid var(--line-soft); border-radius: 8px;
    font-size: 11px; color: var(--muted); align-items:center;
  }
  .legend-title{ color: var(--text); font-weight:600; margin-right:2px;}
  .legend-item{ display:flex; align-items:center; gap:5px; }
  .legend-dot{ width:8px; height:8px; border-radius:2px; }

  /* ---------- DOCK GRID (FORMATO TABLA 2 COLUMNAS) ---------- */
  .docks-wrap{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .dock-col-title{
    font-family:'Space Grotesk', sans-serif;
    font-size: 12px; font-weight:700; letter-spacing: 0.8px; color: var(--text);
    margin-bottom: 6px;
    display:flex; align-items:center; gap:6px;
  }
  .dock-col-title::after{
    content:''; flex:1; height:1px; background: var(--line-soft);
  }
  
  .dock-grid{
    display:flex;
    flex-direction:column;
    gap: 3px;
  }

  /* Fila estilo Tabla Ultra Compacta */
  .dock-row{
    display:flex;
    align-items:center;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 3px 6px;
    gap: 8px;
    font-size: 11.5px;
  }
  .dock-row.empty{ opacity:.45; background: var(--panel-alt); }

  /* Recuadro Muelle - Total de Rutas */
  .dock-badge{
    font-family:'Space Grotesk', sans-serif;
    font-size: 11.5px; font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--dock-color, var(--muted));
    background: var(--dock-bg, var(--c0-bg));
    border: 1px solid var(--dock-color, var(--line));
    white-space: nowrap;
    min-width: 46px;
    text-align: center;
  }

  /* Métrica de Paquetes */
  .dock-metric{
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px; font-weight: 600; color: var(--text);
    white-space: nowrap;
  }
  .dock-empty-label{
    font-family:'JetBrains Mono', monospace; font-size: 10.5px; color: var(--muted-dim);
  }

  /* Rutas alineadas en la misma fila */
  .dock-routes-inline{
    display:flex;
    align-items:center;
    gap: 5px;
    overflow: hidden;
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--muted);
  }
  .dock-route-item{ white-space: nowrap; }

  @media (max-width: 820px){
    .docks-wrap{ grid-template-columns: 1fr; }
  }

  /* ---------- IMPRESIÓN ---------- */
  @media print{
    body{ padding: 0; }
    .card-action-group, .dropzone{ display:none !important; }
    .legend-top, .docks-wrap, .dock-row{ break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="dropzone" class="dropzone">
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
    <div class="dz-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v12m0-12l-4 4m4-4l4 4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
    </div>
    <div class="dz-title">Cargar archivo de rutas</div>
    <div class="dz-sub">Arrastra tu <b>.xlsx</b> / <b>.csv</b> aquí, o haz clic para elegir el archivo</div>
    <div class="dz-error" id="dzError"></div>
  </div>

  <div class="board" id="board">

    <!-- RENGLÓN DE HEADER Y TARJETAS ALINEADAS EN LA MISMA HILERA -->
    <div class="top-row-grid">
      
      <!-- Título -->
      <div class="top-card card-brand">
        <div class="brand">Layout <span>Muelles</span></div>
      </div>

      <!-- Jornada -->
      <div class="top-card card-jornada">
        <div class="stat-label">Jornada</div>
        <div class="jornada-val" id="jornadaTag">—</div>
      </div>

      <!-- Métricas -->
      <div class="top-card stat-card">
        <div class="stat-label">Paquetes</div>
        <div class="stat-value" id="statPaquetes">0</div>
      </div>

      <div class="top-card stat-card">
        <div class="stat-label">Rutas</div>
        <div class="stat-value" id="statRutas">0</div>
      </div>

      <div class="top-card stat-card">
        <div class="stat-label">Paradas</div>
        <div class="stat-value" id="statParadas">0</div>
      </div>

      <div class="top-card stat-card">
        <div class="stat-label">Muelles</div>
        <div class="stat-value" id="statMuelles">0 <small id="statMuellesTotal">/ 0</small></div>
      </div>

      <!-- Acciones de Carga e Impresión -->
      <div class="card-action-group">
        <label class="upload-btn-card">
          <input type="file" id="fileInputInline" accept=".xlsx,.xls,.csv">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0-12l-4 4m4-4l4 4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
          <span>Cargar Viajes</span>
        </label>
        <button class="print-btn-card" id="printBtn">Imprimir</button>
      </div>

    </div>

    <!-- LEYENDA (POR ENCIMA DE LAS COLUMNAS DE MUELLES) -->
    <div class="legend-top">
      <span class="legend-title">Ocupación:</span>
      <div class="legend-item"><span class="legend-dot" style="background:#9ea3b0"></span>Vacío</div>
      <div class="legend-item"><span class="legend-dot" style="background:#3b82f6"></span>1 ruta</div>
      <div class="legend-item"><span class="legend-dot" style="background:#a855f7"></span>2 rutas</div>
      <div class="legend-item"><span class="legend-dot" style="background:#ef4444"></span>3 rutas</div>
      <div class="legend-item"><span class="legend-dot" style="background:#f97316"></span>4 rutas</div>
      <div class="legend-item"><span class="legend-dot" style="background:#ec4899"></span>5+ rutas</div>
    </div>

    <!-- COLUMNAS EN FORMATO TABLA DE 2 COLUMNAS -->
    <div class="docks-wrap">
      <div>
        <div class="dock-col-title">A - P</div>
        <div class="dock-grid" id="gridLeft"></div>
      </div>
      <div>
        <div class="dock-col-title">AC - Q</div>
        <div class="dock-grid" id="gridRight"></div>
      </div>
    </div>

  </div>

</div>

<script>
const LEFT_DOCKS  = ['A','B','C','D','E','F','G','H','I','J','K','L','M','N','O','P'];
const RIGHT_DOCKS = ['AC','AB','AA','Z','Y','X','W','V','U','T','S','R','Q'];
const ALL_DOCKS = [...LEFT_DOCKS, ...RIGHT_DOCKS];

const COLOR_BY_COUNT = {
  0: {c:'var(--c0)', bg:'var(--c0-bg)'},
  1: {c:'var(--c1)', bg:'var(--c1-bg)'},
  2: {c:'var(--c2)', bg:'var(--c2-bg)'},
  3: {c:'var(--c3)', bg:'var(--c3-bg)'},
  4: {c:'var(--c4)', bg:'var(--c4-bg)'},
};
function colorFor(n){
  if(n>=5) return {c:'var(--c5)', bg:'var(--c5-bg)'};
  return COLOR_BY_COUNT[n] || COLOR_BY_COUNT[0];
}

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const fileInputInline = document.getElementById('fileInputInline');
const dzError = document.getElementById('dzError');
const board = document.getElementById('board');

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault(); dropzone.classList.remove('drag');
  if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if(e.target.files.length) handleFile(e.target.files[0]);
});
fileInputInline.addEventListener('change', e => {
  if(e.target.files.length) handleFile(e.target.files[0]);
});
document.getElementById('printBtn').addEventListener('click', () => window.print());

function norm(s){
  return String(s == null ? '' : s).trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function findHeaderRow(rows){
  for(let i=0;i<Math.min(rows.length, 15);i++){
    const cells = rows[i].map(norm);
    if(cells.some(c => c.includes('muelle'))) return i;
  }
  return 0;
}

function findCol(headerCells, candidates){
  for(const cand of candidates){
    const idx = headerCells.findIndex(c => c === norm(cand));
    if(idx !== -1) return idx;
  }
  for(const cand of candidates){
    const idx = headerCells.findIndex(c => c.includes(norm(cand)));
    if(idx !== -1) return idx;
  }
  return -1;
}

function handleFile(file){
  dzError.style.display = 'none';
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
      processRows(rows);
    }catch(err){
      showError('No se pudo leer el archivo. Verifica que sea un Excel (.xlsx) o CSV válido.');
      console.error(err);
    }
  };
  reader.onerror = () => showError('Error al leer el archivo.');
  reader.readAsArrayBuffer(file);
}

function showError(msg){
  dzError.style.display = 'block';
  dzError.textContent = msg;
  board.classList.remove('active');
  dropzone.style.display = 'block';
}

function processRows(rows){
  if(!rows || rows.length < 2){ showError('El archivo no tiene datos suficientes.'); return; }

  const headerIdx = findHeaderRow(rows);
  const headerCells = rows[headerIdx].map(norm);

  const colMuelle = findCol(headerCells, ['muelle de salida','muelle']);
  const colParadas = findCol(headerCells, ['paradas','# paradas']);
  const colParadasAlt = findCol(headerCells, ['# paradas','paradas']);
  const colJornada = findCol(headerCells, ['jornada']);
  const colId = findCol(headerCells, ['id']);

  if(colMuelle === -1){
    showError('No se encontró la columna "Muelle de salida" en el archivo.');
    return;
  }

  const dataRows = rows.slice(headerIdx+1).filter(r => r && r.some(c => String(c).trim() !== ''));

  const dockStats = {};
  ALL_DOCKS.forEach(d => dockStats[d] = {count:0, paquetes:0, routes:[]});
  const extraDocks = {};

  let totalPaquetes = 0;
  let totalRutas = 0;
  const jornadas = new Set();

  dataRows.forEach(r => {
    const muelleRaw = colMuelle !== -1 ? r[colMuelle] : '';
    const muelle = String(muelleRaw == null ? '' : muelleRaw).trim().toUpperCase();
    if(!muelle) return;

    let paradasVal = colParadas !== -1 ? r[colParadas] : (colParadasAlt !== -1 ? r[colParadasAlt] : 0);
    paradasVal = Number(paradasVal) || 0;

    const jornadaVal = colJornada !== -1 ? String(r[colJornada] ?? '').trim() : '';
    if(jornadaVal) jornadas.add(jornadaVal);

    totalRutas += 1;
    totalPaquetes += paradasVal;

    const target = dockStats[muelle] || (extraDocks[muelle] = extraDocks[muelle] || {count:0, paquetes:0, routes:[]});
    target.count += 1;
    target.paquetes += paradasVal;
    target.routes.push({
      id: colId !== -1 ? r[colId] : '',
      paradas: paradasVal
    });
  });

  const activeDocks = ALL_DOCKS.filter(d => dockStats[d].count > 0).length;

  renderHeader({
    totalPaquetes,
    totalRutas,
    totalParadas: totalPaquetes,
    jornadas: Array.from(jornadas),
    activeDocks,
    totalDocks: ALL_DOCKS.length
  });

  renderGrid('gridLeft', LEFT_DOCKS, dockStats);
  renderGrid('gridRight', RIGHT_DOCKS, dockStats);

  dropzone.style.display = 'none';
  board.classList.add('active');
}

function renderHeader(info){
  document.getElementById('statPaquetes').textContent = info.totalPaquetes.toLocaleString('es-MX');
  document.getElementById('statRutas').textContent = info.totalRutas.toLocaleString('es-MX');
  document.getElementById('statParadas').textContent = info.totalParadas.toLocaleString('es-MX');
  document.getElementById('statMuelles').firstChild.textContent = info.activeDocks + ' ';
  document.getElementById('statMuellesTotal').textContent = '/ ' + info.totalDocks;

  const tag = document.getElementById('jornadaTag');
  if(info.jornadas.length === 0){
    tag.textContent = '—';
  } else if(info.jornadas.length === 1){
    tag.textContent = info.jornadas[0];
  } else {
    tag.textContent = info.jornadas.join(' · ');
  }
}

function renderGrid(containerId, dockList, dockStats){
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  dockList.forEach(letter => {
    const stat = dockStats[letter];
    const color = colorFor(stat.count);
    const el = document.createElement('div');
    el.className = 'dock-row' + (stat.count === 0 ? ' empty' : '');
    el.style.setProperty('--dock-color', color.c);
    el.style.setProperty('--dock-bg', color.bg);

    let routesHtml = '';
    if(stat.count > 0){
      const routeIds = stat.routes.map(r => String(r.id || '').split(' - ')[0]).filter(Boolean);
      routesHtml = `<div class="dock-routes-inline">${routeIds.map(id => `<span class="dock-route-item">${id}</span>`).join(' ')}</div>`;
    }

    el.innerHTML = `
      <div class="dock-badge">${letter} - ${stat.count}</div>
      ${stat.count > 0
        ? `<div class="dock-metric">${stat.paquetes.toLocaleString('es-MX')} paquetes</div>`
        : `<div class="dock-empty-label">sin asignar</div>`}
      ${routesHtml}
    `;
    container.appendChild(el);
  });
}
</script>
</body>
</html>
